<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VisitWorld{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: linear-gradient(135deg, #1d4ed8 0%, #0f766e 50%, #22c55e 100%);
            color: white;
            padding: 28px 40px;
            text-align: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }

        header h1 {
            margin: 0;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        nav {
            margin-top: 18px;
        }

        nav a {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin: 0 14px;
            font-weight: bold;
            font-size: 18px;
            padding: 8px 14px;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        nav a:hover {
            background-color: rgba(255, 255, 255, 0.18);
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        footer {
            text-align: center;
            color: #6b7280;
            padding: 20px;
            font-size: 14px;
        }

        .button-link {
            display: inline-block;
            padding: 10px 16px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 10px;
        }

        .button-link:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <header>
        <h1>VisitWorld</h1>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'country_list' %}">Countries</a>
            <a href="{% url 'test_mode' %}">Test mode</a>
            <a href="{% url 'country_create' %}">Add country</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        Educational Django project about countries, languages, borders, cities, and organizations.
    </footer>
</body>
</html>
